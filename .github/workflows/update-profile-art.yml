name: Update profile art

# Refreshes the contribution heatmap + stats card from Utkarsha-pattern's
# public contribution calendar. Daily, on demand, and on pushes to main.
# The bot commit message includes [skip ci] so it does not retrigger itself.

on:
  schedule:
    - cron: "17 6 * * *"   # ~06:17 UTC every day
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Scrape real contribution data (no auth needed)
        env:
          GH_PROFILE_USER: Utkarsha-pattern
        run: python scripts/fetch_contributions.py

      - name: Render animated contribution heatmap
        run: python scripts/render_heatmap_svg.py

      - name: Render streak / numbers card
        run: python scripts/render_stats_svg.py

      - name: Commit updated art
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh contribution graph [skip ci]"
          file_pattern: "data/contributions.json contrib-heatmap.svg stats.svg"
