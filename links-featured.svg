<svg xmlns="http://www.w3.org/2000/svg" width="860" height="400" viewBox="0 0 860 400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
<style>
  .in { opacity: 0; animation: rise 0.45s ease-out both; }
